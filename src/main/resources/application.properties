# アプリケーション基本設定
spring.application.name=tlias-web-management
server.port=8080

# Jackson 日時フォーマット・タイムゾーン設定
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Tokyo

# データベース接続設定 (MySQL 8.0)
spring.datasource.url=jdbc:mysql://localhost:3306/tlias?serverTimezone=Asia/Tokyo&useUnicode=true&characterEncoding=utf-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:your_password}

# ファイルアップロードサイズ制限
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# MyBatis 設定
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis.configuration.map-underscore-to-camel-case=true

# トランザクションログレベル設定
logging.level.org.springframework.jdbc.support.JdbcTransactionManager=debug